<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по немецкому языку</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="german-style.css">
</head>
<body>
    <nav>
        <div class="nav-content">
            <span>📚 Тест по немецкому языку</span>
        </div>
    </nav>

    <main>
        <section class="hero">
            <div class="eyebrow">Оценка знаний</div>
            <h1>Тест по <em>немецкому</em> языку</h1>
            <p class="subtitle">Пройдите тест для оценки уровня владения немецким языком. Выберите один правильный ответ для каждого вопроса.</p>
        </section>

        <section class="test-container" id="userForm">
            <div class="form-group">
                <label for="lastName">Фамилия</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label for="firstName">Имя</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label for="age">Возраст</label>
                <input type="number" id="age" required min="1" max="120">
            </div>
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" required>
            </div>
            <button class="btn-primary" onclick="startTest()">Начать тест</button>
        </section>

        <section class="test-container" id="testSection" style="display: none;">
            <div id="questionsContainer"></div>
            <button id="submitBtn" class="btn-primary" onclick="submitTest()">Отправить результаты</button>
        </section>

        <section class="test-container" id="resultsSection" style="display: none;">
            <h2>Результаты теста</h2>
            <div id="resultsContent"></div>
        </section>
    </main>

    <script src="german-app.js?v=3"></script>
</body>
</html>
